name: publish-apk

# **上游 forge 够不着**的源码仓，把构建产物送进 `_incoming` 暂存队列（03 §3.2 / §8）。
#
# ⚠️ 判据是"读不读得到上游"，**不是"私有不私有"**（D55）：同一个 `market-of-labs` owner 下
# 的私有仓（如 companion）照样是**普通上游** —— forge 的 GitHub 客户端本来就带那把 PAT，
# 在 PAT 的仓库清单里加上它即可，用不着这个文件。真正需要它的是两类：源码仓在**别的 owner**
# 名下（fine-grained PAT 只覆盖一个 owner，结构上读不到），以及根本**没有上游**的
# source: "manual"。
#
# 这两类的做法一样：不提上游，只把产物送进上传队列 —— 与「人在网页上手动传 APK」走的是同一条
# 下游路径，代价只有最后那一声：人自己点按钮，这里发一个 repository_dispatch。
# 除此之外 forge 一行代码都不用改，也不需要拿到各 App 源码仓的任何东西。
#
# 调用方在自己的仓库里写这么一段（构建 job 先 upload-artifact，名字必须是 apk）：
#
#   jobs:
#     build:
#       runs-on: ubuntu-latest
#       steps:
#         - uses: actions/checkout@v7
#         - run: ./gradlew assembleRelease
#         - uses: actions/upload-artifact@v7
#           with: { name: apk, path: app/**/*.apk }
#     publish:
#       needs: build
#       uses: market-of-labs/store/.github/workflows/publish-apk.yml@master   # 本仓库默认分支是 master（不是 main）
#       with: { app-id: com.you.closedapp }
#       secrets: { store-token: ${{ secrets.STORE_TOKEN }} }
#
# 放在 store 而不是各 App 仓：store 是 `_incoming` 的宿主，也是唯一知道仓库名的地方。
# 一份实现、一处修 bug，各 App 仓不用各抄一份。
#
# 硬规矩（与 forward.yml 同一套）：
#   1. `run:` 里零 `${{ }}` 插值 —— 外部值全部走 `env:`（`${{ }}` 在 run: 里是文本拼接，
#      传进来一个带引号的 appId 就能改掉整段脚本）
#   2. 走 PAT（`secrets.store-token`）而不是 GITHUB_TOKEN —— 后者出不了本仓库（§6.2 不变量 1）
#   3. 只往 `_incoming` 写。清场（保持在 draft、删掉已搬走的 asset）是 forge 的活（§3.2 规则 6），
#      这里绝不碰任何正式 Release
#   4. 收尾时**显式叫一声** forge（repository_dispatch）。队列常驻 draft，没有"发布即发车"
#      那种事件可等；上传本身不触发任何事件（§3.3），所以这一步不能省。

on:
  workflow_call:
    inputs:
      app-id:
        description: 应用的 appId，与 APK 里的 package 逐字一致。传之前用它确认这个包名已收录。
        type: string
        required: true
      apk:
        description: 构建产物路径（相对仓库根，可通配）。多 ABI 分片可以一次全传。
        type: string
        required: false
        default: dist/*.apk
      store-repo:
        description: store 仓库的 owner/repo。
        type: string
        required: false
        default: market-of-labs/store
    secrets:
      store-token:
        description: 细粒度 PAT，需要 store 的 contents:write（传 asset、建队列）**以及 forge 的 contents:write**（收尾时的 repository_dispatch —— 那个事件是往 forge 仓库发的，所以同一把 token 得够得着它）
        required: true

permissions: {} # 不需要 GITHUB_TOKEN 的任何权限（走 PAT）

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # ⚠️ 一切外部数据只经 env 传入；下面 run: 里一处 ${{ }} 都没有。
      GH_TOKEN: ${{ secrets.store-token }}
      STORE: ${{ inputs.store-repo }}
      APP_ID: ${{ inputs.app-id }}
      APK_GLOB: ${{ inputs.apk }}
      # 收尾要叫的那一声发给谁。写死而不是做成 input：store 与 forge 是同一套部署的
      # 两个固定点，调用方（各 App 仓）不该、也不需要知道怎么拼这个地址。
      FORGE: market-of-labs/forge
    steps:
      - name: 取构建产物
        uses: actions/download-artifact@v8
        with:
          name: apk
          path: dist

      - name: 确认这个包名已收录
        run: |
          # 这不是"没收录就搬不进去"（forge 现在会按 APK 的 package 当场把条目建出来，
          # 见 03 §3.2 / D52）。留着它是为了挡住**打错的 app-id**：真正的落点由 APK 内容
          # 决定，所以这里跟 app-id 对不上时，写错的后果是 store 里悄悄多出一条作者为
          # 「未知」的陌生来源 —— 那是事后翻 git 历史才看得见的那种错误。
          if ! gh api "repos/$STORE/contents/sources/$APP_ID.json" >/dev/null 2>&1; then
            echo "::error::store 里没有 sources/$APP_ID.json。若这个包名是新的：先把 APK 传一次（forge 会替它建条目，作者记成「未知」，之后用 change-source.yml 补），再回来跑这里；若它本该已收录：app-id 打错了。"
            exit 1
          fi

      - name: 找回暂存区，并确认它是 draft
        run: |
          set -euo pipefail

          # `/releases/tags/_incoming` 对 draft 是 404：draft 还没有真 tag，GitHub 把它
          # 藏在 untagged-* 引用下。所以按列表筛 tag_name 拿 id，之后一切按 id 打 ——
          # by-id 端点对 draft 与正式版一视同仁。
          #
          # --paginate 不能省：Release 数是随收录数长的，越过每页 30 的默认值之后，
          # 队列会被挤出第一页 —— 症状是静默的「找不到 _incoming」，纯属分页的假故障。
          id=$(gh api --paginate "repos/$STORE/releases" \
            --jq '.[] | select(.tag_name == "_incoming") | .id' | head -1)
          if [ -z "$id" ]; then
            echo "::error::store 里没有 tag 为 _incoming 的 Release。它是个**常驻队列**（03 §3.2），状态无所谓 —— 有这个 tag 就行，本 workflow 会先把它复位成 draft。但 forge 故意不自动建：凭空冒出一个空队列出来，只会掩盖「你其实传到了别处」这个事实。"
            exit 1
          fi

          # ⚠️ 上传之前先把这条不变量拧住：队列**永远**是 draft（§3.2）。
          #
          # 正常情况下这句 PATCH 不产生任何状态变化 —— forge 每次搬完都把它留在
          # draft，队列自己不会变成别的样子。留着它是防**人手**：在网页上把队列
          # Publish 掉之后就再也点不回去了（published 的 Release 只有 Update /
          # Delete，没有 Publish 按钮），而发布过的队列仍然收得下 asset、只是不会
          # 有任何事件（§3.3）—— 一个谁也看不出来的死局。这里顺手把它拉回来。
          gh api -X PATCH "repos/$STORE/releases/$id" -f draft=true >/dev/null
          echo "暂存区已确认为 draft（id=$id）"

          # 递给后面两步（写进 $GITHUB_ENV 的值，后续 step 直接当环境变量用）。
          echo "INCOMING_ID=$id" >> "$GITHUB_ENV"

      - name: 传进暂存队列
        run: |
          set -euo pipefail

          files=( $APK_GLOB ) # 故意不加引号：要的就是通配展开
          if [ ! -e "${files[0]}" ]; then
            echo "::error::没匹配到 APK（$APK_GLOB）—— 构建 job 里 upload-artifact 的 path 对得上吗"
            exit 1
          fi

          for f in "${files[@]}"; do
            n=$(basename "$f")

            # 同名旧 asset 先删掉。这不是 §4.6 禁的那个 --clobber（那条规矩管的是正式
            # Release 里**已发布**的版本不许被覆盖）；这里删的是我们自己上一轮没搬成功的
            # 残骸 —— 不删的话重跑一律 422，而重跑恰恰是最常见的动作。
            old=$(gh api --paginate "repos/$STORE/releases/$INCOMING_ID/assets" \
              --jq ".[] | select(.name == \"$n\") | .id")
            if [ -n "$old" ]; then
              gh api -X DELETE "repos/$STORE/releases/$INCOMING_ID/assets/$old"
              echo "删掉同名的旧 asset：$n（上一轮的残骸）"
            fi

            # 名字随你打（构建产物叫什么就是什么）：forge 只读 APK 内容，
            # 搬进正式 Release 时会按内容改名（§3.3）。
            gh api -X POST -H "Content-Type: application/octet-stream" \
              "repos/$STORE/releases/$INCOMING_ID/assets?name=$n" --input "$f" >/dev/null
            echo "已传进 _incoming：$n（$(du -h "$f" | cut -f1)）"
          done

      - name: 叫 forge 来搬
        run: |
          set -euo pipefail

          # 队列常驻 draft，搬运**只能被显式叫起来**（03 §3.2）：upload / 改名 / 删
          # asset 都不触发任何事件（§3.3），从前那条「Publish 一下就自动发车」的路
          # 已经不存在了。所以这里是收尾那一声。
          #
          # 发的是**信标**不是数据（§2.6）：只说「搬 _incoming」，搬什么由 forge 自己
          # 用 API 去 store 读。于是这条路径上没有任何外部字符串进入 forge 的执行环境。
          #
          # 用 --input - 从 stdin 读 body：secret 与 JSON 都不进 argv（不进进程列表）。
          gh api -X POST "repos/$FORGE/dispatches" --input - <<'JSON' >/dev/null
          {"event_type":"store-event","client_payload":{"event":"intake-incoming"}}
          JSON

          echo "已叫过 forge 了 —— 它会把 _incoming 里**这一批全部** asset 搬进各自的正式 Release，并重建清单。"
          echo "结果看 forge 仓的 Actions 日志（on-dispatch）：搬不进去的会**留在 _incoming** 并逐条写明原因（03 §3.2，不静默丢弃）。"
