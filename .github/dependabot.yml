version: 2

# store 也有 action 依赖了，所以它同样需要一份 —— 用的既然是主版本标签，不配这个就等于
# 钉死在当前主版本上。只剩下**一个**：
#   - `.github/actions/beacon` 里的 `actions/github-script@v9`。
#
# ⚠️ 信标那个 action 在 `.github/actions/beacon/action.yml` 里，而不是某个 workflow 里：
# 两个入口文件（source-change / intake-incoming）都 `uses` 它。
# （`reconcile.yml` 已于 2026-09-18 删除 —— 对账的触发面全在 forge 侧，见 README。
#  `publish-apk.yml` 同日删除 —— 它带的 `actions/download-artifact@v8` 就是这里原来的第二条，
#  随文件一起没了；见 README §4 与 03 §2.6.5。）
#
# 这个仓库是私有的，所以顺带确认它不花分钟数：本仓库的 workflow 只在
# issues / release / 手动按钮 上跑，Dependabot 开的是普通 PR，触发不了
# 任何东西。它也**只开 PR**，不合并、不写 sources/，碰不到任何会被转发出去的东西。
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # 只有一个生态、一个依赖，合成一个 PR，别刷屏。
    groups:
      actions:
        patterns: ['*']
