version: 2

# store 也有 action 依赖了（forward.yml 的 actions/github-script），所以它同样需要
# 一份 —— 用的既然是主版本标签（`@v9`），不配这个就等于钉死在当前主版本上。
#
# 这个仓库是私有的，所以顺带确认它不花分钟数：本仓库的 workflow 只在
# issues / release / push(sources/**) 上跑，Dependabot 开的是普通 PR，触发不了
# 任何东西。它也**只开 PR**，不合并、不写 sources/，碰不到任何会被转发出去的东西。
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # 只有一个生态、一个依赖，合成一个 PR，别刷屏。
    groups:
      actions:
        patterns: ['*']
