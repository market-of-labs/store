name: 变更 · 移除
description: 修改元数据 / 暂停更新 / 恢复更新 / 移除一个已收录的应用
title: "[变更] "
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ 想「停更」请选**暂停更新**，不要选移除。移除**不会**让已同步设备上那一行消失
        （deep link 只有创建/覆盖、没有删除动作），只会让新设备不再收录。

        同一 issue 只处理一个 appId。下面的字段只在「修改元数据」时才有意义，其余动作留空即可。

  - type: input
    id: appId
    attributes:
      label: 目标 appId
      description: 已收录的包名，例如 dev.imranr.obtainium
    validations:
      required: true

  - type: dropdown
    id: action
    attributes:
      label: 动作
      options:
        - 修改元数据
        - 暂停更新
        - 恢复更新
        - 移除
    validations:
      required: true

  - type: input
    id: newName
    attributes:
      label: 新的显示名（仅「修改元数据」时填）
    validations:
      required: false

  - type: input
    id: newAuthor
    attributes:
      label: 新的作者 / 组织（仅「修改元数据」时填）
    validations:
      required: false

  - type: input
    id: newAssetPattern
    attributes:
      label: 新的资产匹配正则（仅「修改元数据」时填）
      description: 用来从上游 Release 的资产里挑出要镜像的 APK，留空则匹配 *.apk。一个仓库同时发布多个不同包名的 APK 时，这条是唯一的消歧办法。
      placeholder: "app.*\\.apk$"
    validations:
      required: false

  - type: input
    id: newDesc
    attributes:
      label: 新的简介（仅「修改元数据」时填）
      description: 拼在列表显示名后面，形如「应用名 · 简介」，**最多 20 个字**（超了会被截断）。留空 = 不改简介；**这里表达不了"改成空"**，真想清空就在下面的「说明」里写一句。
      placeholder: 去广告的第三方客户端
    validations:
      required: false

  - type: checkboxes
    id: newCategories
    attributes:
      label: 新的分类标签（仅「修改元数据」时填）
      description: 勾中的即**全量替换**原有的分类。一个都不勾 = 不改分类。
      options:
        - label: 工具
        - label: 效率
        - label: 媒体
        - label: 通讯
        - label: 开发
        - label: 游戏
        - label: 其他

  - type: textarea
    id: reason
    attributes:
      label: 说明（可选）
      description: 便于回查为什么这么改。
    validations:
      required: false
