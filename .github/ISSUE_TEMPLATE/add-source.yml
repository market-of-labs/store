name: 新增 · 标准源
description: 申请收录一个新的 GitHub 上游应用（给小圈子成员用，不需要仓库写权限）
title: "[新增] "
body:
  - type: markdown
    attributes:
      value: |
        **只需要填上游仓库。** 包名、显示名、作者都由 forge 当场从 APK 与仓库里读出来 ——
        不用你查，填了也不作数。

        代价是：**仓库填错会静默收错应用**。所以会在回评里把读出来的身份念一遍，请核对一眼。

        提交后几分钟内就会回评（收录了哪个版本、或者为什么没收），本单随即自动关闭。
        失败时会写明原因、**保持开着**等你补完，**不用重开单** —— 改完**编辑正文**即可重新发车。

  - type: input
    id: repo
    attributes:
      label: 上游 GitHub 仓库
      description: owner/repo 形式。必须可匿名读（公开仓库）。填错时本单会收到一条说明并保持开着，改完编辑正文即可重试。
      placeholder: ImranR98/Obtainium
    validations:
      required: true

  - type: input
    id: assetPattern
    attributes:
      label: 资产匹配正则（可选）
      description: 用来从上游 Release 的资产里挑出要镜像的 APK，留空则匹配 *.apk。如果一个仓库同时发布了多个不同包名的 APK，这条是唯一的消歧办法 —— 那时不填会被拒，按回评提示补上即可。
      placeholder: "app.*\\.apk$"
    validations:
      required: false

  - type: input
    id: desc
    attributes:
      label: 一句话简介（可选）
      description: 会拼在 Obtainium 列表里的**显示名**后面，形如「应用名 · 你的简介」。这是列表行上唯一能写字的空白处，所以**最多 20 个字**（超了会被截断，并在回评里告诉你）。留空就只显示应用名。
      placeholder: 去广告的第三方客户端
    validations:
      required: false

  - type: checkboxes
    id: categories
    attributes:
      label: 分类标签（可选）
      description: 会显示在 Obtainium 的列表色条与筛选里。建议至少勾一个；一个都不勾也能收录。
      options:
        - label: 工具
        - label: 效率
        - label: 媒体
        - label: 通讯
        - label: 开发
        - label: 游戏
        - label: 其他

  - type: checkboxes
    id: abiWhitelist
    attributes:
      label: 只镜像哪些 ABI（可选）
      description: 一个都不勾 = 全部分片都镜像；勾了就只镜像勾中的（省 Release 空间）。
      options:
        - label: arm64-v8a
        - label: armeabi-v7a
        - label: x86_64
        - label: x86
        - label: universal
